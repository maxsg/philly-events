name: Build weekly events

on:
  schedule:
    - cron: "23 22 * * 0"   # Sundays 22:23 UTC = 5:23pm Philly in winter, 6:23pm in summer
  push:
    branches: [main]
    paths: ["config/**", "eventcal/**", "run.py"]   # editing manual.yaml rebuilds right away
  workflow_dispatch:
    inputs:
      date:
        description: "Pretend today is (YYYY-MM-DD). Blank = today."
        required: false

permissions:
  contents: write

concurrency:
  group: weekly-build
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt -r requirements-dev.txt
      - run: python -m pytest -q
      - name: Build digest and feeds
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          TICKETMASTER_API_KEY: ${{ secrets.TICKETMASTER_API_KEY }}
          FEED_BASE_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}
        run: python run.py ${{ github.event.inputs.date && format('--date {0}', github.event.inputs.date) || '' }}
      - name: Commit outputs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs
          git diff --cached --quiet || git commit -m "Weekly build $(date -u +%F)"
          git push
